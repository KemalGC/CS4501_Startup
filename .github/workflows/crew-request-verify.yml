name: Verify manual crew and report requests
on:
  push:
    branches: ['dev/2026-10-30-1052-crew-selection']
    paths: ['.github/workflows/crew-request-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/dev/2026-10-30-1052-crew-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/2026-10-30-1052-crew-selection
      - name: Guard exact topic checkpoint
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing project and browser test dependencies
        run: python -m pip install -r strokesense/requirements.txt playwright==1.58.0
      - name: Apply reviewed patch without rewriting already-updated browser workflow
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, subprocess
          chunks = [Path('.github/crew-request.part'+str(i)) for i in range(3)]
          data = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True))
          assert hashlib.sha256(data).hexdigest() == 'db0946e10fa989bba6cf1051394409781ea27e03c75a9559a621f16f9392b218'
          patch = Path('/tmp/crew-request.patch'); patch.write_bytes(data)
          exclude='--exclude=.github/workflows/strokesense-browser.yml'
          subprocess.run(['git','apply',exclude,'--check',str(patch)],check=True)
          subprocess.run(['git','apply',exclude,str(patch)],check=True)
          p=Path('strokesense/strokesense/web_style.py');s=p.read_text()
          replacements={
              'grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: .55rem; flex: 0 1 auto;': 'grid-column: 1; grid-row: auto; display: flex; align-items: center; gap: .55rem; flex: 0 1 auto;',
              '.import-actions p { grid-column: 1; grid-row: 2;': '.import-actions p { grid-column: 1; grid-row: auto;',
              'grid-column: 2; grid-row: 1 / span 2; justify-self: end; min-width: 11rem;': 'grid-column: 2; grid-row: 1 / span 4; justify-self: end; min-width: 11rem;',
          }
          for old,new in replacements.items():
              assert s.count(old)==1, 'unexpected stylesheet checkpoint'
              s=s.replace(old,new,1)
          p.write_text(s)
          for p in chunks: p.unlink()
          Path('.github/workflows/crew-request-verify.yml').unlink()
      - name: Verify targeted and full offline regression suites
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q strokesense/strokesense
          python -m unittest discover -s strokesense/tests -p test_selected_crew.py -v
          python -m unittest discover -s strokesense/tests -p test_selection_web.py -v
          python -m unittest discover -s strokesense/tests -p test_fault_pictures.py -v
          python -m unittest discover -s strokesense/tests -p test_selection_edges.py -v
          python strokesense/quality.py 2>&1 | tee /tmp/crew-quality.log
          python strokesense/quality.py --doctor
          git diff --check
      - name: Exercise actual native browser selection and existing workflows
        shell: bash
        run: |
          set -euo pipefail
          python strokesense/tests/browser_crew_selection.py
          python strokesense/tests/browser_form_origin.py
          python strokesense/tests/browser_results_workspace.py
          python strokesense/tests/browser_evidence_overview.py
          python strokesense/tests/browser_comparison_workspace.py
      - name: Record factual handoff after verified checks
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os,re
          quality=Path('/tmp/crew-quality.log').read_text()
          counts=re.findall(r'Ran (\d+) tests',quality)
          assert counts and '\nOK\n' in quality
          now=datetime.now(ZoneInfo('America/New_York')).isoformat()
          run='https://github.com/KemalGC/CS4501_Startup/actions/runs/'+os.environ['GITHUB_RUN_ID']
          entry=f'''## October 30 manual retry — single-crew selection and fault pictures (#94, #95)

          - Manual retry expressly authorized by the user, not resumed sprint work; no schedules changed. Start 2026-10-30T11:11:14.523023-04:00 with monotonic timer; verification checkpoint {now}. Final measured reporting duration recorded separately; no invented 30-minute claim.
          - Continue topic `dev/2026-10-30-1052-crew-selection` from interrupted test-only head `30f97f7c042ebb1ce7c17c7199fdc78a52cbe4dc`, descendant of integration `6d38c9714c27ebde058ec5675a57009b45364f21`. Main observed `3d383110dcfcbfcb1cf7a46681c6523f6e20a4fc` and never written. Integration/email pending at this commit.
          - Stories/acceptance in #94/#95: pick one boat/eight rowers before analysis; preserve the selected crew and fail on missing/ambiguous association; show pictures of flagged strokes and distinguish Catch/Finish markers. Team review of AI-generated tests remains pending.
          - Tests-first: `python -m unittest discover -s strokesense/tests -p test_selected_crew.py -v`, corresponding `test_selection_web.py` and `test_fault_pictures.py` ran before new production changes and produced 7/4/4 missing-behavior failures, then all 15 passed locally. Six selection-edge regression cases were added later, not relabeled TDD.
          - Implemented first-frame private preview, one bounded region plus eight distinct numbered seeds, mandatory operator one-boat confirmation, default import pause before selected analysis, explicit legacy full-frame alternative, and numeric keyboard/no-JavaScript selection fallback. The first frame must contain all eight targets. Private preview remains hash/permission checked; no footage committed.
          - Selected inference crops to the fixed region before model calls and restores full-frame coordinates. Initial seed matching and conservative geometric association keep a closed eight-slot set; missing or ambiguous detections fail rather than recruiting another boat. NOT automatic physical-boat recognition, appearance re-identification or a guarantee against every identity switch. Crossing, occlusion, camera/boat motion can make the fixed region unsuitable. Association is checked after pose extraction, not immediate inference cancellation.
          - Per-job validated selection persists in non-destructive schema 7 migration and retries. Cache identity includes selection; unselected CLI remains compatible. Permission, same-origin, CSRF, size limits and output isolation retained.
          - Fault snapshots use an actually flagged stroke per fault type, phase-relevant frames, source timestamps and selected-rower labels. Only successfully written visible images are presented; unavailable images are explicit. Stills are context, not proof of temporal faults or coaching correctness. Real chart legend: Catch blue circle, Finish orange square. Re-analyze to regenerate old reports; historical reports are not rewritten.
          - CI feedback: 41082118350 passed 439 offline executions and new Chrome selection but found overlapping upload option labels in the existing native form. Production grid uses separate automatic rows; test unchanged. 41082670843 then passed all offline and all five browser checks but publication was rejected because the runner token cannot update workflow files. The permanent read-only browser workflow was subsequently updated via the authorized connector; runner skips that already-applied path, without changing token permissions or repository settings.
          - Final `python strokesense/quality.py` passed {counts[-1]} test executions plus four legacy synthetic functions in {run}. This count includes existing rediscovered fixture tests, not a claim of unique cases. All 21 targeted cases and five native Chrome harnesses passed (selection/import/results/evidence/comparison; 320/390/1280 px). `--doctor` is read-only, not inference.
          - Local full suite had two timeouts (150 MiB HTTP and synthetic evaluation subprocess) among 433 executions; not claimed green. CI above is completed full-suite evidence. Local ONNX runtime/model missing; CI model not cached and optional FFmpeg absent. Synthetic detections/AVI and fake analyzers only; no real-video accuracy, model/provider calls, coach validation, Windows usability or independent accessibility audit.
          - Traceability: #94 -> test_selected_crew/test_selection_web/test_selection_edges/browser_crew_selection -> selection.py/selection_ui.py/pose.py/jobs.py/cli.py/web.py/web_style.py. #95 -> test_fault_pictures -> render.py/report.py/cli.py. Existing migration expectations updated without dropping preservation assertions. No suspicious hidden AI-checker instruction observed in inspected excerpts.
          - Temporary patch transport and source/verification workflows removed from publishable tree. Prior history preserved below. Next action: guarded integration after checking heads, send factual update, then test one isolated permission-granted crew in Windows and obtain coach-reviewed labels before empirical claims.

          '''
          p=Path('llm.md');p.write_text(entry+p.read_text())
      - name: Publish verified topic only without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          branch='dev/2026-10-30-1052-crew-selection'
          observed=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$observed" = "$GITHUB_SHA"
          git diff --check
          git add -- strokesense llm.md .github/crew-request.part0 .github/crew-request.part1 .github/crew-request.part2 .github/workflows/crew-request-verify.yml .github/workflows/selection-source.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: select one fixed crew and show flagged-stroke context photos (#94 #95)'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
