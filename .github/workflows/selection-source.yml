name: Selection source snapshot
on:
  push:
    branches: ['dev/2026-10-30-1052-crew-selection']
    paths: ['.github/workflows/selection-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: selection-source
          path: source.tar
          retention-days: 1
