name: StrokeSense Alpha scoped line coverage
on:
  push:
    branches: ['dev/**']
    paths:
      - 'strokesense/**'
      - '.github/workflows/strokesense-alpha-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies and coverage
        run: |
          python -m pip install -r strokesense/requirements.txt
          python -m pip install coverage==7.10.7
      - name: Run unit suite with coverage (scope: Python strokesense package)
        working-directory: strokesense
        shell: bash
        run: |
          set -o pipefail
          python -m coverage run --branch --source=strokesense -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/strokesense-alpha-tests.log
          python -m coverage report --skip-empty | tee /tmp/strokesense-alpha-coverage.txt
          python -m coverage json -o coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: strokesense-alpha-coverage
          path: |
            strokesense/coverage.json
            /tmp/strokesense-alpha-tests.log
            /tmp/strokesense-alpha-coverage.txt
          retention-days: 7
