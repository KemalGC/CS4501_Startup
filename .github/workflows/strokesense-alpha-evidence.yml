name: StrokeSense Alpha reproducible evidence
on:
  push:
    branches: ['dev/2026-11-04-alpha-finalization']
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record exact source and public issue inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/alpha-evidence
          git rev-parse HEAD > /tmp/alpha-evidence/source-sha.txt
          git archive --format=zip HEAD -o /tmp/alpha-evidence/source.zip
          git log --format='%H%x09%aI%x09%s' --name-status > /tmp/alpha-evidence/history.txt
          gh api --paginate --slurp 'repos/${{ github.repository }}/issues?state=all&per_page=100' > /tmp/alpha-evidence/issues-pages.json
      - name: Install test dependencies
        run: |
          python -m pip install -r strokesense/requirements.txt -r strokesense/requirements-hosted.txt coverage==7.10.7
      - name: Run issue 122 acceptance tests
        working-directory: strokesense
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_alpha_metrics.py -v 2>&1 | tee /tmp/alpha-evidence/issue-122.log
      - name: Run full Python suite and line coverage
        working-directory: strokesense
        shell: bash
        run: |
          set -o pipefail
          python -m coverage run --branch --source=strokesense -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/alpha-evidence/unit-tests.log
          python -m coverage json -o /tmp/alpha-evidence/coverage.json
          python -m coverage report > /tmp/alpha-evidence/coverage.txt
          python -m unittest discover -s hosting_tests -p 'test_*.py' -v 2>&1 | tee /tmp/alpha-evidence/hosted-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strokesense-alpha-evidence-${{ github.sha }}
          path: /tmp/alpha-evidence/
          retention-days: 14
