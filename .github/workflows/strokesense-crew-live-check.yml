name: StrokeSense explicit real eight-rower model check
on:
  push:
    branches: ['dev/2026-11-02-1400-crew-analysis-options']
    paths: ['.github/workflows/strokesense-crew-live-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-model:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare bounded evaluation dependencies
        run: |
          mkdir -p .crew-check/evidence .crew-check/runtime
          python -m pip install numpy==1.26.4 opencv-python-headless==4.11.0.86
      - name: Verify official pinned local runtime before execution
        run: |
          curl --fail --silent --show-error --location --max-time 180 --max-filesize 2000000000 https://github.com/ollama/ollama/releases/download/v0.12.6/ollama-linux-amd64.tgz -o .crew-check/runtime.tgz
          echo 'de82adce2ab79235115d511ff22fcb099ac53b67127870f12b80198c033ec0a1  .crew-check/runtime.tgz' | sha256sum --check
          tar -xzf .crew-check/runtime.tgz -C .crew-check/runtime
          rm .crew-check/runtime.tgz
          .crew-check/runtime/bin/ollama serve > .crew-check/evidence/server.log 2>&1 &
          for i in $(seq 1 20); do curl --fail --silent http://127.0.0.1:11434/api/tags && break || sleep 1; done
          timeout 180 .crew-check/runtime/bin/ollama pull qwen3-vl:4b
      - name: Actual vision inference, not a synthetic analyzer
        run: |
          python - <<'PY'
          import base64, hashlib, json, time, urllib.request
          from pathlib import Path
          import cv2
          root=Path('.crew-check');out=root/'evidence'
          source='https://upload.wikimedia.org/wikipedia/commons/5/52/Rowing_boat_racing_8-man_%2B_cox.webm'
          req=urllib.request.Request(source,headers={'User-Agent':'StrokeSense bounded research evaluation/1.0'})
          with urllib.request.urlopen(req,timeout=45) as response:
              data=response.read(60000001)
          assert len(data)<=60000000 and hashlib.sha256(data).hexdigest()=='971dbbea9b924565428849377c408eeb568f7fd99d89c4ad71319be0b9d283ac'
          video=root/'public-eight.webm';video.write_bytes(data)
          cap=cv2.VideoCapture(str(video));cap.set(cv2.CAP_PROP_POS_FRAMES,99);ok,image=cap.read();cap.release();assert ok
          h,w=image.shape[:2]
          seeds=[[.21390,.57444],[.31175,.58168],[.41178,.58208],[.50529,.59015],[.60043,.58659],[.69740,.60443],[.80052,.60922],[.90383,.61611]]
          marked=image.copy()
          for i,(x,y) in enumerate(seeds,1):
              x,y=int(x*w),int(y*h);cv2.circle(marked,(x,y),7,(0,220,255),2);cv2.putText(marked,f'R{i}',(x,y-10),cv2.FONT_HERSHEY_SIMPLEX,.6,(0,220,255),2)
          def encode(im):
              im=cv2.resize(im,(1280,round(im.shape[0]*1280/im.shape[1]))) if im.shape[1]>1280 else im
              return base64.b64encode(cv2.imencode('.jpg',im)[1]).decode()
          box={'anyOf':[{'type':'null'},{'type':'array','minItems':4,'maxItems':4,'items':{'type':'number','minimum':0,'maximum':1}}]}
          item={'type':'object','additionalProperties':False,'required':['rower_id','visible','box'],'properties':{'rower_id':{'type':'integer','minimum':1,'maximum':8},'visible':{'type':'boolean'},'box':box}}
          schema={'type':'object','additionalProperties':False,'required':['rowers'],'properties':{'rowers':{'type':'array','minItems':8,'maxItems':8,'items':item}}}
          payload={'model':'qwen3-vl:4b','stream':False,'keep_alive':'10m','messages':[{'role':'user','content':'Image 1 marks eight reference rowers R1..R8, excluding the coxswain at the left. Image 2 is the SAME unmarked source frame. For each marked ID in order return whether that rower is visible and its tight full-body bounding box [left,top,right,bottom] normalized 0..1. Do not box the entire boat or reuse one person. Return all eight IDs; unknown box=null. No names or advice. Schema: '+json.dumps(schema),'images':[encode(marked),encode(image)]}],'format':schema,'options':{'temperature':0,'num_predict':2048,'num_ctx':8192}}
          manifest={'real_inference_attempt':True,'model':'qwen3-vl:4b','runtime':'0.12.6','source_frame':99,'reference_label_origin':'assistant visual reference seeds, not independent human labels','accuracy_claim':'none','private_user_video_used':False}
          with urllib.request.urlopen('http://127.0.0.1:11434/api/tags') as r:manifest['installed_models']=json.load(r)
          started=time.perf_counter()
          try:
              req=urllib.request.Request('http://127.0.0.1:11434/api/chat',json.dumps(payload).encode(),{'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=150) as r:response=json.load(r)
              (out/'actual-model-response.json').write_text(json.dumps(response,indent=2))
              predictions=json.loads(response['message']['content'])['rowers'];correct=[]
              for i,(p,seed) in enumerate(zip(predictions,seeds),1):
                  b=p.get('box');valid=p.get('rower_id')==i and p.get('visible') is True and isinstance(b,list) and len(b)==4 and b[0]<=seed[0]<=b[2] and b[1]<=seed[1]<=b[3]
                  if valid:
                      valid=sum(b[0]<=x<=b[2] and b[1]<=y<=b[3] for x,y in seeds)==1
                  correct.append(bool(valid))
              manifest.update(completed=True,structurally_returned_rowers=len(predictions),reference_localized_by_rower=correct,reference_localized_count=sum(correct),all_eight_reference_check=len(correct)==8 and all(correct),not_a_temporal_or_rate_test=True)
              cv2.imwrite(str(out/'reference-marked.jpg'),marked)
          except Exception as exc:
              manifest.update(completed=False,blocker=type(exc).__name__)
          manifest['wall_seconds']=time.perf_counter()-started
          (out/'live-check.json').write_text(json.dumps(manifest,indent=2))
          (out/'ATTRIBUTION.txt').write_text('Splash tv: Rowing boat racing 8-man + cox. Wikimedia Commons, CC BY-SA 4.0. https://commons.wikimedia.org/wiki/File:Rowing_boat_racing_8-man_%2B_cox.webm . Changes: sampled frame and reference annotations. Derived image CC BY-SA 4.0. No endorsement. This is a development smoke test, not independent accuracy validation.')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Retain real output and any blocker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crew-live-model-check
          path: .crew-check/evidence/
          retention-days: 3
