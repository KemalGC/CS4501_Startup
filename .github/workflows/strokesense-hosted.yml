name: StrokeSense hosted review checks
on:
  push:
    branches: ['dev/**', 'dev-consolidated']
    paths: ['render.yaml', 'strokesense/**', '.github/workflows/strokesense-hosted.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r strokesense/requirements-hosted.txt playwright==1.58.0
      - name: Install real-video browser-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - run: python -m unittest discover -s strokesense/hosting_tests -p 'test_*.py' -v
      - run: python strokesense/hosting_tests/browser_hosted.py
      - run: python strokesense/hosting_tests/browser_tester_links.py
