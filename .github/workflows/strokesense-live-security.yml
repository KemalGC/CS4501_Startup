name: StrokeSense live security checks

on:
  push:
    branches: [codex/production-security-hardening]
    paths:
      - 'strokesense/strokesense/**'
      - 'strokesense/tests/test_hosted_cancel.py'
      - 'strokesense/tests/test_pose_download_security.py'
      - 'strokesense/tests/test_hosted_hardening.py'
      - 'strokesense/requirements-*.txt'
      - 'render.yaml'
      - '.github/workflows/strokesense-live-security.yml'
  pull_request:
    branches: [strokesense-render-live]
    paths:
      - 'strokesense/strokesense/**'
      - 'strokesense/tests/test_hosted_cancel.py'
      - 'strokesense/tests/test_pose_download_security.py'
      - 'strokesense/tests/test_hosted_hardening.py'
      - 'strokesense/requirements-*.txt'
      - 'render.yaml'
      - '.github/workflows/strokesense-live-security.yml'

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies without model wheels
        run: |
          python -m pip install -r strokesense/requirements-hosted.txt
          python -m pip install numpy scipy opencv-python-headless
      - name: Verify hosted request controls and model integrity
        working-directory: strokesense
        run: |
          python -m unittest discover -s tests -p 'test_hosted_cancel.py' -q
          python -m unittest discover -s tests -p 'test_pose_download_security.py' -q
          python -m unittest discover -s tests -p 'test_hosted_hardening.py' -q
