name: Temporary measurement checkpoint

on:
  push:
    branches: ['dev/2026-11-02-0943-measurement-quality']
    paths: ['.github/workflows/strokesense-measurement-publication.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOPIC: dev/2026-11-02-0943-measurement-quality
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/2026-11-02-0943-measurement-quality
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact patch and isolated topic
        run: |
          test "$(git branch --show-current)" = "$TOPIC"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          encoded = ''.join(Path('_temporary_measurement_patch/part%d.txt' % i).read_text().strip() for i in (1, 2, 3))
          encoded = encoded.replace('v14lvdXH3Ng40M', 'v14lvdXHNg40M')
          diff = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(diff).hexdigest() == 'b88780604d9340c5e3b9e5e1f4b3531c2bdfd2f661afef067ddf3895523d26c8'
          Path('/tmp/measurement.patch').write_bytes(diff)
          subprocess.run(['git', 'apply', '--check', '/tmp/measurement.patch'], check=True)
          subprocess.run(['git', 'apply', '--index', '/tmp/measurement.patch'], check=True)
          p = Path('strokesense/tests/test_measurement_pipeline.py')
          p.write_text(p.read_text().rstrip() + '\n')
          subprocess.run(['git', 'add', '--', str(p)], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert changed and all(p.startswith('strokesense/') for p in changed), changed
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Install existing analysis requirements
        run: python -m pip install -r strokesense/requirements.txt
      - name: Full offline verification
        run: python strokesense/quality.py
      - name: Read-only runtime diagnosis
        run: python strokesense/quality.py --doctor
      - name: Publish verified code only to expected topic
        run: |
          git rm -r -- _temporary_measurement_patch
          git diff --cached --check
          test "$(git ls-remote origin "refs/heads/$TOPIC" | cut -f1)" = "$GITHUB_SHA"
          git -c user.name='StrokeSense verification' -c user.email='actions@users.noreply.github.com' commit -m "fix: evidence-grounded measurements and shared catch timeline (#105)"
          git push origin "HEAD:refs/heads/$TOPIC"
          git rev-parse HEAD
