name: StrokeSense opt-in real video inspection

on:
  push:
    branches: ['dev/2026-11-01-1927-report-gaps']
    paths: ['.github/workflows/strokesense-real-video.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      YOLO_AUTOINSTALL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only evaluation dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 opencv-python==4.11.0.86 matplotlib==3.9.2 ultralytics==8.3.0 onnx==1.17.0 onnxruntime==1.23.2
      - name: Fetch explicitly licensed public clips and upstream model
        run: |
          mkdir -p .smoke/evidence .smoke/runtime
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          assets = [
            ('eight.webm', 'https://upload.wikimedia.org/wikipedia/commons/5/52/Rowing_boat_racing_8-man_%2B_cox.webm', 'https://commons.wikimedia.org/wiki/File:Rowing_boat_racing_8-man_%2B_cox.webm', 'Splash tv', 'CC BY-SA 4.0'),
            ('amsterdam.webm', 'https://upload.wikimedia.org/wikipedia/commons/7/79/Rowing_in_Amsterdam.webm', 'https://commons.wikimedia.org/wiki/File:Rowing_in_Amsterdam.webm', 'Jan Ainali', 'CC BY-SA 4.0'),
            ('yolo11n-pose.pt', 'https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n-pose.pt', 'https://docs.ultralytics.com/models/yolo11/', 'Ultralytics', 'AGPL-3.0')]
          manifest=[]
          for name,url,source,author,license in assets:
              path=Path('.smoke')/name
              request=urllib.request.Request(url,headers={'User-Agent':'StrokeSense research smoke test/1.0 (https://github.com/KemalGC/CS4501_Startup)'})
              h=hashlib.sha256(); size=0
              with urllib.request.urlopen(request,timeout=90) as response, path.open('wb') as output:
                  while chunk:=response.read(1024*1024):
                      size+=len(chunk)
                      if size>180*1024*1024: raise ValueError('asset exceeds bounded download')
                      h.update(chunk);output.write(chunk)
              manifest.append(dict(file=name,source=source,url=url,author=author,license=license,bytes=size,sha256=h.hexdigest()))
          Path('.smoke/evidence/sources.json').write_text(json.dumps(manifest,indent=2))
          Path('.smoke/evidence/ATTRIBUTION.txt').write_text('Video frames: Splash tv, Rowing boat racing 8-man + cox; Jan Ainali, Rowing in Amsterdam. Wikimedia Commons, CC BY-SA 4.0 https://creativecommons.org/licenses/by-sa/4.0/. Changes: sampled frames and overlaid unreviewed model detections. Annotated images remain CC BY-SA 4.0. Sources/hashes in sources.json. No endorsement implied. Model: Ultralytics YOLO11n-pose, AGPL-3.0 https://www.gnu.org/licenses/agpl-3.0.html; exported with Ultralytics 8.3.0. Counts are not accuracy; no human ground-truth labels. No private user footage used.')
          PY
      - name: Export trusted upstream pose weights to the existing ONNX format
        run: |
          python - <<'PY'
          from ultralytics import YOLO
          model=YOLO('.smoke/yolo11n-pose.pt')
          model.export(format='onnx',opset=17,simplify=False,dynamic=False,imgsz=640,device='cpu')
          PY
      - name: Inspect eight-person crew with actual model execution
        run: python strokesense/tests/real_video_smoke.py --model .smoke/yolo11n-pose.onnx --video .smoke/eight.webm --start 3 --seconds 2 --out .smoke/evidence/eight
      - name: Inspect separate real rowing clip with actual model execution
        run: python strokesense/tests/real_video_smoke.py --model .smoke/yolo11n-pose.onnx --video .smoke/amsterdam.webm --start 3 --seconds 2 --out .smoke/evidence/amsterdam
      - name: Retain evaluation evidence, never private recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-video-evidence
          path: .smoke/evidence/
          retention-days: 3
      - name: Prepare exact runtime for local reproduction
        run: |
          python -m pip download --only-binary=:all: --platform manylinux_2_27_x86_64 --python-version 313 --abi cp313 --implementation cp --no-deps onnxruntime==1.23.2 -d .smoke/runtime
          python -m pip download --only-binary=:all: --no-deps flatbuffers==25.2.10 coloredlogs==15.0.1 humanfriendly==10.0 -d .smoke/runtime
          cp .smoke/yolo11n-pose.onnx .smoke/runtime/
          cp .smoke/evidence/ATTRIBUTION.txt .smoke/evidence/sources.json .smoke/runtime/
      - uses: actions/upload-artifact@v4
        with:
          name: real-video-runtime
          path: .smoke/runtime/
          retention-days: 1
