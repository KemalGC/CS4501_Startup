name: StrokeSense manual real-video speed benchmark
on:
  push:
    branches: ['dev/2026-11-03-0937-vision-speed']
    paths: ['.github/workflows/strokesense-speed-live.yml']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          mkdir -p .speed/evidence .speed/runtime
          python -m pip install -r strokesense/requirements.txt
      - name: Verify and start pinned official runtime
        run: |
          curl --fail --silent --show-error --location --max-time 120 --max-filesize 1700000000 https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tar.zst -o .speed/runtime.tar.zst
          echo 'c9490e0f520be21271d969e6703f012268b1d39f8b70dd58854e5bfef7a75bb6  .speed/runtime.tar.zst' | sha256sum --check
          tar --zstd -xf .speed/runtime.tar.zst -C .speed/runtime
          rm .speed/runtime.tar.zst
          .speed/runtime/bin/ollama serve > .speed/evidence/server.log 2>&1 &
          for i in $(seq 1 20); do curl --fail --silent http://127.0.0.1:11434/api/tags && break || sleep 1; done
          timeout 150 .speed/runtime/bin/ollama pull qwen3-vl:4b
      - name: Actual corrected reference-request test
        run: |
          python -u - <<'PY'
          import base64,hashlib,json,sys,time,urllib.request
          from pathlib import Path
          import cv2
          sys.path.insert(0,'strokesense')
          from strokesense.crew_model import CrewVision,mark_frame
          from strokesense.vision_speed import fast_crew
          from strokesense.blade_video import _jpeg
          root=Path('.speed');out=root/'evidence'
          url='https://upload.wikimedia.org/wikipedia/commons/5/52/Rowing_boat_racing_8-man_%2B_cox.webm'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'StrokeSense research benchmark/1.0'}),timeout=45) as r:data=r.read(60000001)
          assert hashlib.sha256(data).hexdigest()=='971dbbea9b924565428849377c408eeb568f7fd99d89c4ad71319be0b9d283ac'
          video=root/'eight.webm';video.write_bytes(data)
          cap=cv2.VideoCapture(str(video));cap.set(cv2.CAP_PROP_POS_FRAMES,99);ok,im=cap.read();assert ok
          frame={'frame_id':99,'time':cap.get(cv2.CAP_PROP_POS_MSEC)/1000,'image':base64.b64encode(_jpeg(im)).decode()};cap.release()
          seeds=[[.21390,.57444],[.31175,.58168],[.41178,.58208],[.50529,.59015],[.60043,.58659],[.69740,.60443],[.80052,.60922],[.90383,.61611]]
          ref=mark_frame(frame,seeds=seeds);p=CrewVision('qwen3-vl:4b',timeout=120);p.cache_dir=root/'cache'
          result={'kind':'actual_Qwen_corrected_reference_request','runtime':'0.40.13','source_frame':99,'private_media':False,'model':p.check(),'runs':[],'limits':'Same-frame model predictions, not full-video SPM or independent accuracy.'}
          original=p._request
          def record(route,payload=None):
              data=original(route,payload)
              if route=='/api/chat':(out/'actual-response.json').write_text(json.dumps(data,indent=2))
              return data
          p._request=record
          for label in ['cold','exact_repeat']:
              start=time.perf_counter();run={'label':label}
              try:
                  obs=fast_crew(p,ref,[frame],seeds,['position']);run.update(completed=True,observations=obs)
                  run['visible_rowers']=sum(r['same_rower'] for r in obs[0]['rowers'])
                  run['reference_points_in_boxes']=sum(bool(r['same_rower'] and r['box'] and r['box'][0]<=x<=r['box'][2] and r['box'][1]<=y<=r['box'][3]) for r,(x,y) in zip(obs[0]['rowers'],seeds))
              except Exception as exc:run.update(completed=False,reason=type(exc).__name__,detail=str(exc)[:160])
              run['seconds']=time.perf_counter()-start;run['speed_stats']=p.speed_stats.copy();result['runs'].append(run)
              (out/'results.json').write_text(json.dumps(result,indent=2));print(json.dumps(run),flush=True)
              if not run['completed']:break
          (out/'ATTRIBUTION.txt').write_text('Splash tv, Rowing boat racing 8-man + cox, CC BY-SA4.0. https://commons.wikimedia.org/wiki/File:Rowing_boat_racing_8-man_%2B_cox.webm . One video source frame, assistant reference points, not independent ground truth. No private footage.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strokesense-live-speed-v2
          path: .speed/evidence/
          retention-days: 3
