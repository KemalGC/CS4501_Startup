name: ProofGrade checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      PROOFGRADE_HINT_MODE: demo
      PROOFGRADE_STORE_ATTEMPTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m proofgrade.evaluate --split all
      - run: python -m proofgrade.demo
      - run: node --check proofgrade/static/app.js

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t proofgrade:test .
      - run: docker run -d --name proofgrade -p 127.0.0.1:8000:8000 proofgrade:test
      - name: Check packaged app
        run: |
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/api/problems
          curl --fail http://127.0.0.1:8000/static/app.js
      - if: always()
        run: docker logs proofgrade
