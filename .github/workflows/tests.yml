name: ProofGrade checks

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      PROOFGRADE_HINT_MODE: demo
      PROOFGRADE_STORE_ATTEMPTS: 'false'
      PROOFGRADE_TEACHER_AI: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock -r requirements-media.lock
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m proofgrade.evaluate --split all
      - run: python -m proofgrade.demo
      - run: node --check proofgrade/static/app.js
      - run: node --check proofgrade/static/teacher.js
      - run: node --check proofgrade/static/image-upload.js

  windows:
    runs-on: windows-latest
    env:
      PROOFGRADE_HINT_MODE: demo
      PROOFGRADE_TEACHER_AI: disabled
      PROOFGRADE_STORE_ATTEMPTS: 'false'
      PROOFGRADE_TEACHER_DB: data/teachers-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[dev]'
      - name: Confirm the default install has no image or PDF libraries
        run: python -c "import importlib.util; assert importlib.util.find_spec('PIL') is None; assert importlib.util.find_spec('pypdfium2') is None"
      - run: python -m pytest -q tests/test_media_startup.py tests/test_api.py tests/test_image_pages.py tests/test_teacher.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teacher-browser-previews
          path: test-results/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t proofgrade:test .
      - run: docker run -d --name proofgrade -p 127.0.0.1:8000:8000 proofgrade:test
      - name: Check packaged app
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/api/problems
          curl --fail http://127.0.0.1:8000/static/app.js
      - if: always()
        run: docker logs proofgrade
