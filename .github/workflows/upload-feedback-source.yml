name: Upload feedback source
on:
  push:
    branches: ['dev/2026-10-30-1156-upload-feedback']
    paths: ['.github/workflows/upload-feedback-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > /tmp/upload-feedback-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: upload-feedback-source
          path: /tmp/upload-feedback-source.tar
          retention-days: 1
