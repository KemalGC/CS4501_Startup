[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proofgrade"
version = "0.2.0"
description = "Teacher-reviewed algebra homework, checked feedback, and targeted practice"
requires-python = ">=3.11"
dependencies = [
    "sympy==1.14.0",
    "pydantic>=2.9,<3",
    "httpx>=0.28,<0.29",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
media = ["pillow>=13,<14", "pypdfium2>=5.14,<6"]

[tool.setuptools.packages.find]
include = ["proofgrade*"]

[tool.setuptools.package-data]
proofgrade = ["static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
