services:
  - type: web
    name: strokesense-alpha
    runtime: python
    repo: https://github.com/KemalGC/CS4501_Startup
    branch: dev-consolidated
    rootDir: strokesense
    plan: 0.5c-512mb
    region: virginia
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements-hosted.txt
    startCommand: uvicorn strokesense.feedback_hosted:create_app --factory --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 32 --timeout-keep-alive 5 --no-proxy-headers --no-access-log
    healthCheckPath: /healthz
    disk:
      name: strokesense-study
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: STROKESENSE_DATA_DIR
        value: /var/data
      - key: STROKESENSE_OWNER_KEY
        generateValue: true
      - key: STROKESENSE_EXPECTED_CLIPS
        value: "7"
